apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo
resources:
  - ../../base
  - pdb.yaml
# Production runs a version that staging has already run. Never edit this by
# hand to get ahead of staging: tools/gitops.py check fails if you do.
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.0
replicas:
  - name: podinfo
    count: 2
labels:
  - pairs:
      environment: production
    includeSelectors: false
patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: podinfo
      spec:
        template:
          spec:
            containers:
              - name: podinfo
                env:
                  - name: PODINFO_UI_MESSAGE
                    value: production
                  - name: PODINFO_UI_COLOR
                    value: "#2f855a"
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
